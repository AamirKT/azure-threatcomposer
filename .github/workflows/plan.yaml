name: Terraform Plan

on:
  workflow_run:
    workflows: ["Build and Push Docker Image to ACR"]
    types:
      - completed

  workflow_dispatch:

concurrency:
  group: terraform-plan
  cancel-in-progress: true

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      id-token: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download image URI artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: image-uri
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image URI as environment variable
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "TF_VAR_container_image=$(cat image-uri.txt)" >> $GITHUB_ENV
            else
            SHORT_SHA=${GITHUB_SHA::8}
            echo "TF_VAR_container_image=${{ vars.ACR_REGISTRY }}/${{ vars.ACR_REPOSITORY }}:git-${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Configure Azure credentials via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform 
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.3

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: 0.56.0

      - name: Init TFLint
        working-directory: terraform
        run: tflint --init

      - name: Run TFLint
        working-directory: terraform
        run: tflint

      - name: Setup Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          soft_fail: true

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        env:
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Terraform Show
        working-directory: terraform
        run: terraform show -no-color tfplan

      - name: Upload Terraform Plan as artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            terraform/tfplan
            image-uri.txt
