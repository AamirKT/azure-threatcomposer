name: Terraform Apply

on:
  workflow_run:
    workflows: ["Terraform Plan"]
    types:
      - completed 
    branches:
      - main

  workflow_dispatch:
    inputs: 
      plan_run_id:
        description: 'The ID of the Terraform Plan run to apply'
        required: true  
        type: string

concurrency:
  group: terraform-apply
  cancel-in-progress: true

jobs:
  terraform-apply:
    runs-on: ubuntu-latest

    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success') &&
        (github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.head_branch == 'main'
        )
      }}

    environment: production

    permissions:
      contents: read
      id-token: write
      actions: read
    
    steps:

      - name: Validate Terraform Plan run
        id: validate-plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.plan_run_id }}
        run: |
          set -euo pipefail

          if [[ ! "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid Plan run ID."
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}" > run.json

          if ! jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            '
              .status == "completed" and
              .conclusion == "success" and
              .head_branch == "main" and
              .head_repository.full_name == $repo and
              (.path | startswith(".github/workflows/plan.yaml")) and
              (.head_sha | test("^[0-9a-f]{40}$"))
            ' run.json > /dev/null; then
            echo "Plan run validation failed."
            echo "The run must be a successful Terraform Plan on main in this repository."
            exit 1
          fi

          PLAN_SHA=$(jq -r '.head_sha' run.json)

          echo "Validated Terraform Plan run: $PLAN_RUN_ID"
          echo "Plan commit: $PLAN_SHA"

          echo "plan_sha=$PLAN_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout plan commit
        uses: actions/checkout@v4
        with:
            ref: ${{ steps.validate-plan.outputs.plan_sha }}

      - name: Download Terraform Plan artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.plan_run_id }}
        run: |
          set -euo pipefail

          gh run download "$PLAN_RUN_ID" \
            --name terraform-plan \
            --dir . \
            --repo "$GITHUB_REPOSITORY"

          if [ ! -s terraform/tfplan ]; then
            echo "Terraform plan file is missing."
            exit 1
          fi

          if [ ! -s image-uri.txt ]; then
            echo "Image URI file is missing."
            exit 1
          fi

      - name: Show image being deployed
        run: |
          echo "Deploying image: $(cat image-uri.txt)"  
    
      - name: Configure Azure credentials via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_APPLY }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan


      - name: Post-deploy health check
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://${{ vars.DOMAIN_NAME }}/health.json
          follow-redirect: true
          max-attempts: 20
          retry-delay: 15s
        


        